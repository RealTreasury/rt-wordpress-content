<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop Banner</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    /* The rota adds .banner-logo for entries whose `logo` field is true.
       RT-owned promotions leave it off; a Forum entry opts in through its
       data rather than by editing the markup. */
    --forum-logo: url("https://realtreasury.com/wp-content/uploads/2026/08/TreasuryTech-Virtual-Forum-Main-Logo-White.jpg");
}

body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #f8f8f8, #fff);
    padding: 0;
    margin: 0;
    overflow-x: hidden;
}

body.banner-minimized,
body.banner-closed { min-height: auto; }

.workshop-banner {
    width: 100%;
    margin: 0;
    background: linear-gradient(135deg, 
        rgba(255, 255, 255, 0.25), 
        rgba(255, 255, 255, 0.15) 25%, 
        rgba(114, 22, 244, 0.08) 50%, 
        rgba(255, 255, 255, 0.15) 75%, 
        rgba(255, 255, 255, 0.25));
    backdrop-filter: blur(25px) saturate(140%);
    -webkit-backdrop-filter: blur(25px) saturate(140%);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-top: none;
    border-bottom: 1px solid rgba(199, 125, 255, 0.2);
    box-shadow: 
        0 8px 32px rgba(114, 22, 244, 0.12),
        0 1px 0 rgba(255, 255, 255, 0.4) inset,
        0 -1px 0 rgba(255, 255, 255, 0.2) inset,
        0 20px 40px rgba(0, 0, 0, 0.02);
    padding: 16px 40px;
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    z-index: 1000010 !important;
    min-height: 80px !important;
    overflow: hidden !important;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    cursor: pointer;
    /* Remove complex animations - start in final state */
    opacity: 1 !important;
    transform: translateY(0) !important;
    transition: min-height 0.3s ease, background 0.3s ease, padding 0.3s ease !important;
}

.workshop-banner:before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, 
        transparent, 
        #7216f4 20%, 
        #8f47f6 50%, 
        #c77dff 80%, 
        transparent);
    opacity: 0.8;
    z-index: 1;
}

.workshop-banner:after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: 
        radial-gradient(circle at 20% 20%, rgba(114, 22, 244, 0.03) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(143, 71, 246, 0.03) 0%, transparent 50%),
        linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent 30%);
    pointer-events: none;
    z-index: 0;
}

/* Minimized state - keep key info visible */
.workshop-banner.minimized {
    min-height: 60px !important;
    padding: 10px 16px !important;
    cursor: pointer;
    background: linear-gradient(135deg,
        rgba(114, 22, 244, 0.9),
        rgba(143, 71, 246, 0.95) 50%,
        rgba(157, 78, 221, 0.9)) !important;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 12px;
}

/* In minimized state, show condensed info instead of hiding everything */
.workshop-banner.minimized .banner-content {
    opacity: 1 !important;
    pointer-events: auto !important;
    transform: none !important;
    flex-grow: 1;
}

.workshop-banner.minimized .banner-icon {
    width: 40px !important;
    height: 40px !important;
    font-size: 18px !important;
    background: rgba(255, 255, 255, 0.2) !important;
    color: #ffffff !important;
}

.workshop-banner.minimized .banner-logo {
    width: 52px !important;
    background-color: #ffffff !important;
    background-image: var(--forum-logo) !important;
    background-size: 100% !important;
    background-position: center 46% !important;
}

.workshop-banner.minimized .banner-text {
    display: flex !important;
    align-items: center;
    white-space: nowrap !important;
    overflow: hidden !important;
    text-overflow: ellipsis !important;
    gap: 4px;
}

.workshop-banner.minimized .banner-title {
    font-size: 1rem !important;
    margin-bottom: 0 !important;
    margin-right: 6px !important;
    color: #ffffff !important;
}

.workshop-banner.minimized .banner-subtitle {
    display: inline !important;
    font-size: 0.75rem !important;
    opacity: 0.9 !important;
    color: #ffffff !important;
    line-height: 1.2 !important;
    white-space: nowrap !important;
    overflow: hidden !important;
    text-overflow: ellipsis !important;
    max-width: clamp(220px, 45vw, 620px) !important;
}

.workshop-banner.minimized .banner-cta {
    padding: 8px 16px !important;
    font-size: 0.85rem !important;
    min-width: 100px !important;
    background: rgba(255, 255, 255, 0.25) !important;
    border-color: rgba(255, 255, 255, 0.4) !important;
}

.workshop-banner.minimized .banner-cta span {
    display: none !important;
}

.workshop-banner.minimized .close-btn {
    display: none !important;
}

.banner-content {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 20px;
    position: relative;
    z-index: 2;
    /* Remove problematic transitions */
    transition: none !important;
}

.banner-icon {
    width: 48px;
    height: 48px;
    background: linear-gradient(135deg, 
        rgba(114, 22, 244, 0.15), 
        rgba(143, 71, 246, 0.25) 50%, 
        rgba(157, 78, 221, 0.15));
    backdrop-filter: blur(15px) saturate(120%);
    -webkit-backdrop-filter: blur(15px) saturate(120%);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #7216f4;
    font-size: 22px;
    font-weight: bold;
    box-shadow: 
        0 8px 24px rgba(114, 22, 244, 0.15),
        0 1px 0 rgba(255, 255, 255, 0.4) inset,
        0 -1px 0 rgba(114, 22, 244, 0.1) inset;
    flex-shrink: 0;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}

.banner-speaker img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 20%;
    display: block;
    transform: scale(1.18);
}

/* Treasury Tech Virtual Forum mark. The source art is a square lockup on a
   white field: "TREASURY TECH" sits above the monogram and "VIRTUAL FORUM"
   below it. Both lines are illegible at this size and just repeat the title,
   so the tile crops to the monogram alone. The file is a JPEG, so there is no
   transparency to key out — the tile keeps the artwork's own white ground and
   is sized to the monogram's aspect instead of squeezing it into a square. */
.banner-logo {
    width: 62px;
    background-color: #ffffff;
    background-image: var(--forum-logo);
    background-repeat: no-repeat;
    /* Measured off the artwork (697x721): the monogram occupies x48-646,
       y95-600, with the two text bands at y20-70 and y640-691. At this zoom
       the tile's window lands on source rows 74-632 — inside both gaps, so
       neither word bleeds in. The offset accounts for the background painting
       under the 1px border, which reaches ~12 source rows past the padding
       box on each edge. */
    background-size: 100%;
    background-position: center 46%;
    border-color: rgba(114, 22, 244, 0.2);
}

.banner-icon:before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), transparent 40%);
    pointer-events: none;
    border-radius: 16px;
}

.banner-text {
    flex: 1;
}

.banner-title {
    font-size: 1.2rem;
    font-weight: 700;
    color: #281345;
    margin-bottom: 4px;
    line-height: 1.2;
}

.banner-subtitle {
    font-size: 0.95rem;
    color: #7e7e7e;
    font-weight: 500;
    line-height: 1.3;
}

.banner-highlight {
    color: #7216f4;
    font-weight: 600;
}

/* The rotation crossfades the text and the button label together, so the bar
   never shows one promotion's title beside another's call to action. */
.banner-text {
    transition: opacity 260ms ease;
}

.workshop-banner.swapping .banner-text,
.workshop-banner.swapping .banner-cta {
    opacity: 0;
}

@media (prefers-reduced-motion: reduce) {
    .banner-text,
    .banner-cta {
        transition: none;
    }
}

.workshop-banner.minimized .banner-highlight {
    color: #ffffff !important;
}

.banner-cta {
    background: linear-gradient(135deg, 
        rgba(114, 22, 244, 0.9), 
        rgba(143, 71, 246, 0.95) 50%, 
        rgba(157, 78, 221, 0.9));
    backdrop-filter: blur(15px) saturate(120%);
    -webkit-backdrop-filter: blur(15px) saturate(120%);
    color: white;
    padding: 12px 24px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    transition: opacity 260ms ease, transform 0.3s ease, box-shadow 0.3s ease,
        color 0.3s ease, border-color 0.3s ease;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    position: relative;
    z-index: 2;
    flex-shrink: 0;
    box-shadow: 
        0 8px 24px rgba(114, 22, 244, 0.25),
        0 1px 0 rgba(255, 255, 255, 0.3) inset,
        0 -1px 0 rgba(0, 0, 0, 0.1) inset;
    overflow: hidden;
    min-width: 140px;
    justify-content: center;
}

.banner-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
    z-index: 2;
}

.banner-cta:before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), transparent 50%);
    pointer-events: none;
    border-radius: 12px;
    transition: all 0.3s ease;
}

.banner-cta:hover {
    background: linear-gradient(135deg, 
        rgba(143, 71, 246, 0.95), 
        rgba(157, 78, 221, 1) 50%, 
        rgba(186, 85, 211, 0.95));
    transform: translateY(-2px) scale(1.02);
    box-shadow: 
        0 12px 32px rgba(114, 22, 244, 0.35),
        0 1px 0 rgba(255, 255, 255, 0.4) inset,
        0 -1px 0 rgba(0, 0, 0, 0.15) inset;
    color: white;
    text-decoration: none;
    border-color: rgba(255, 255, 255, 0.3);
}

.banner-cta:hover:before {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.25), transparent 60%);
}

.banner-cta:active {
    transform: translateY(0px);
}

.close-btn {
    position: absolute;
    top: 8px;
    right: 12px;
    background: linear-gradient(135deg, 
        rgba(255, 255, 255, 0.3), 
        rgba(255, 255, 255, 0.2) 50%, 
        rgba(255, 255, 255, 0.1));
    backdrop-filter: blur(10px) saturate(120%);
    -webkit-backdrop-filter: blur(10px) saturate(120%);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: #7216f4;
    cursor: pointer;
    z-index: 3;
    transition: all 0.3s ease;
    font-weight: 700;
    line-height: 1;
    box-shadow: 
        0 4px 12px rgba(114, 22, 244, 0.1),
        0 1px 0 rgba(255, 255, 255, 0.4) inset;
}

.close-btn:hover {
    background: linear-gradient(135deg, 
        rgba(255, 255, 255, 0.4), 
        rgba(255, 255, 255, 0.3) 50%, 
        rgba(255, 255, 255, 0.2));
    border-color: rgba(199, 125, 255, 0.4);
    transform: scale(1.1);
    box-shadow: 
        0 6px 16px rgba(114, 22, 244, 0.15),
        0 1px 0 rgba(255, 255, 255, 0.5) inset;
}

/* Navigation positioning adjustments */
.rt-nav-container {
    top: 0 !important;
    transition: top 0.3s ease !important;
}

body.banner-present .rt-nav-container {
    top: 80px !important;
}
body.banner-closed .rt-nav-container,
body:not(.banner-present) .rt-nav-container {
    top: 0 !important;
}

/* When banner is minimized, adjust navigation */
.workshop-banner.minimized ~ .rt-nav-container,
body.banner-minimized .rt-nav-container {
    top: 60px !important;
}

/* Keep time-sensitive webinar CTA visible on mobile in a compact layout */
@media (max-width: 768px) {
    .workshop-banner {
        display: flex !important;
        align-items: flex-start;
        gap: 12px;
        min-height: 112px !important;
        padding: 12px 16px !important;
    }

    .banner-content {
        gap: 12px;
        min-width: 0;
    }

    .banner-title {
        font-size: 1rem;
        padding-right: 28px;
    }

    .banner-subtitle {
        font-size: 0.78rem;
        line-height: 1.25;
    }

    .banner-actions {
        align-self: center;
    }

    .banner-cta {
        padding: 9px 12px;
        font-size: 0.75rem;
        min-width: 108px;
    }

    .banner-text {
        min-width: 0;
    }

    .workshop-banner.minimized {
        min-height: 60px !important;
        padding: 10px 14px !important;
    }

    .workshop-banner.minimized .banner-subtitle {
        display: none !important;
    }

    body.banner-present .rt-nav-container {
        top: 112px !important;
    }

    body.banner-minimized .rt-nav-container {
        top: 60px !important;
        height: 70px !important;
    }

    body.banner-closed .rt-nav-container,
    body:not(.banner-present) .rt-nav-container {
        top: 0 !important;
    }
}

@media (max-width: 560px) {
    .banner-icon {
        display: none;
    }
}

/* Narrowest screens: stack the CTA under the copy so the title gets the
   full width instead of wrapping a word per line beside it. */
@media (max-width: 480px) {
    .workshop-banner {
        flex-direction: column;
        align-items: stretch !important;
        gap: 10px;
    }

    .banner-actions {
        align-self: stretch;
    }

    .banner-cta {
        width: 100%;
        justify-content: center;
    }

    .workshop-banner.minimized .banner-actions {
        display: none;
    }

    /* Stacked banner is taller than the 768px breakpoint assumes. */
    body.banner-present:not(.banner-minimized) .rt-nav-container {
        top: 134px !important;
    }
}

/* Responsive adjustments */
@media (max-width: 1024px) {
    .workshop-banner {
        padding: 12px 30px;
        gap: 15px;
    }
    
    .banner-title {
        font-size: 1.1rem;
    }
    
    .banner-subtitle {
        font-size: 0.9rem;
    }
}

@media (max-width: 640px) {
    .workshop-banner {
        padding: 10px 20px;
        gap: 10px;
    }
    
    .banner-icon {
        width: 40px;
        height: 40px;
        font-size: 18px;
    }

    .banner-logo {
        width: 52px;
    }
    
    .banner-cta {
        padding: 10px 16px;
        font-size: 0.85rem;
        min-width: 120px;
    }
}
</style>
</head>
<body class="rt-no-body-padding">
    <div class="workshop-banner" id="workshopBanner">
        <button class="close-btn" onclick="closeBanner(event)" aria-label="Close banner">&times;</button>
        
        <div class="banner-content">
            <div class="banner-icon" role="img" aria-label="Real Treasury">RT</div>

            <div class="banner-text">
                <div class="banner-title">
                    <span class="banner-highlight">Tech Selection Guide</span>
                </div>
                <div class="banner-subtitle">
                    The 2026 edition — the segments, the products in each, and how to run the selection.
                </div>
            </div>
        </div>

        <div class="banner-actions">
            <!-- The markup default is the EVERGREEN promotion, never a dated one.
                 bannerLineup() replaces it synchronously before first paint, so a
                 visitor with JavaScript still sees the dated promotion first. A
                 visitor without it sees this, and this cannot expire. Hardcoding a
                 dated promotion here is how "an expired event drops off by itself"
                 stops being true for the no-JS path. -->
            <a href="https://realtreasury.com/treasury-tech-selection-guide/" class="banner-cta">
                Get the Guide
                <span>→</span>
            </a>
        </div>
    </div>

    <div class="site-content"></div>

<script>
/* ---- What the banner promotes -------------------------------------------
 *
 * One entry per promotion. `start`/`end` are INCLUSIVE dates in the site's
 * own timezone. An entry with neither is evergreen: always eligible, so the
 * bar is never empty between events. A dated entry outside its window is not
 * rendered at all \u2014 an expired event drops off by itself.
 *
 * The bar rotates between everything eligible today, dated entries first so
 * the promotion with a deadline is what a visitor sees first. One eligible
 * entry never moves, and neither does the bar for a visitor who asked for
 * reduced motion \u2014 they get the first entry, which is why the order matters.
 *
 * `title` must hold ONE line from 375px to 1440px or the banner grows taller
 * than the hardcoded nav offset and pushes the navigation underneath itself.
 * The budget is 28 characters — put the short name here and the date and the
 * pitch in `subtitle`. scripts/tests/test_banner_destination.js enforces it,
 * along with every url being one this banner is allowed to send people to.
 *
 * `logo: true` swaps the "RT" tile for the Treasury Tech Virtual Forum mark
 * (the --forum-logo var at the top of this file). Leave it off for an
 * RT-owned promotion, or the event gets badged with someone else's mark.
 * ------------------------------------------------------------------------- */
const BANNER_ITEMS = [
    {
        key: 'guide',
        title: 'Tech Selection Guide',
        subtitle: 'The 2026 edition \u2014 the segments, the products in each, and how to run the selection.',
        cta: 'Get the Guide',
        url: 'https://realtreasury.com/treasury-tech-selection-guide/',
        label: 'Real Treasury'
    }
    /* The AFP 2026 Guided Tours slot, retired from the bar on September 22, 2026
       so the Guide release runs alone. To bring it back, uncomment it and add its
       URL back to DESTINATIONS in scripts/tests/test_banner_destination.js.
    ,{
        key: 'tours',
        title: 'AFP 2026 Guided Tours',
        subtitle: 'November 9\u201310 at AFP Las Vegas \u2014 three booths, ten seats, free to attend.',
        cta: 'Register Now',
        url: 'https://realtreasury.com/afp-2026-tms-tour/',
        label: 'Real Treasury',
        start: '2026-09-15',
        end: '2026-11-10'
    }
    */
    /* The Treasury Tech Virtual Forum slot. Fill in the registration URL and
       the dates and uncomment it \u2014 do not guess either; the last banner swap
       shipped an Airmeet link for a retired event.
    ,{
        key: 'forum',
        title: 'Treasury Tech Virtual Forum',
        subtitle: '[TO CONFIRM] date \u2014 [TO CONFIRM] pitch.',
        cta: 'Save a Seat',
        url: '[TO CONFIRM]',
        label: 'Treasury Tech Virtual Forum',
        logo: true,
        start: '[TO CONFIRM]',
        end: '[TO CONFIRM]'
    }
    */
];

// How long each promotion holds the bar when more than one is in window.
const BANNER_ROTATE_MS = 8000;

// Day granularity, read in the site's timezone rather than the visitor's, so a
// window does not open a day early in Singapore and a day late in Honolulu.
function bannerToday() {
    try {
        return new Intl.DateTimeFormat('en-CA', {
            timeZone: 'America/Chicago', year: 'numeric', month: '2-digit', day: '2-digit'
        }).format(new Date());
    } catch (e) {
        return new Date().toISOString().slice(0, 10);
    }
}

function isDateWindow(v) {
    return typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v);
}

// Everything eligible today: dated entries whose window covers today, plus the
// evergreen ones, which are always eligible. Dated first, so the promotion with
// a deadline is the one on screen at first paint and the one a reduced-motion
// visitor sees. An entry without a real https destination is skipped rather
// than rendered as a dead call to action.
function bannerLineup() {
    const today = bannerToday();
    const usable = BANNER_ITEMS.filter(function (item) {
        return item && typeof item.url === 'string' && item.url.indexOf('https://') === 0;
    });
    const dated = usable.filter(function (item) {
        if (!isDateWindow(item.start) || !isDateWindow(item.end)) return false;
        return item.start <= today && today <= item.end;
    });
    const evergreen = usable.filter(function (item) {
        return !isDateWindow(item.start) && !isDateWindow(item.end);
    });
    return dated.concat(evergreen);
}

function applyBannerItem(item) {
    const banner = document.getElementById('workshopBanner');
    if (!banner || !item) return;

    const icon = banner.querySelector('.banner-icon');
    const title = banner.querySelector('.banner-highlight');
    const subtitle = banner.querySelector('.banner-subtitle');
    const cta = banner.querySelector('.banner-cta');

    if (title) title.textContent = item.title;
    if (subtitle) subtitle.textContent = item.subtitle;
    if (icon) {
        icon.setAttribute('aria-label', item.label || 'Real Treasury');
        icon.classList.toggle('banner-logo', item.logo === true);
        // .banner-logo only paints a background image; .banner-icon still centres
        // its text content, so leaving "RT" in place renders it OVER the event's
        // mark. Clear it for a logo entry and restore it for an RT one.
        icon.textContent = item.logo === true ? '' : 'RT';
    }
    if (cta) {
        // The href is the single source of the destination. Every navigation
        // path reads it back off the element, so a swap cannot leave the
        // markup correct and the clicks pointing at the previous event.
        cta.setAttribute('href', item.url);
        // Write the label into the anchor's own text node and leave the arrow
        // <span> alone; replacing innerHTML would drop it.
        let labelNode = null;
        for (let i = 0; i < cta.childNodes.length; i++) {
            if (cta.childNodes[i].nodeType === 3) { labelNode = cta.childNodes[i]; break; }
        }
        if (!labelNode) {
            labelNode = document.createTextNode('');
            cta.insertBefore(labelNode, cta.firstChild);
        }
        labelNode.nodeValue = item.cta + ' ';
    }
    banner.dataset.promo = item.key;
}

function bannerDestination() {
    const cta = document.querySelector('.banner-cta');
    const href = cta ? cta.getAttribute('href') : '';
    return href && href.indexOf('https://') === 0 ? href : '';
}

// Runs synchronously, before first paint, so no one sees the markup's default
// promotion replaced a moment later.
const BANNER_LINEUP = bannerLineup();
let bannerIndex = 0;
let bannerTimer = null;
let bannerSwapTimer = null;

if (BANNER_LINEUP.length) {
    applyBannerItem(BANNER_LINEUP[0]);
} else {
    const emptyBanner = document.getElementById('workshopBanner');
    if (emptyBanner) emptyBanner.style.display = 'none';
}

function startBannerRotation() {
    if (bannerTimer || BANNER_LINEUP.length < 2) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    bannerTimer = setInterval(function () {
        const banner = document.getElementById('workshopBanner');
        if (!banner || banner.style.display === 'none') return;
        banner.classList.add('swapping');
        bannerSwapTimer = setTimeout(function () {
            bannerIndex = (bannerIndex + 1) % BANNER_LINEUP.length;
            applyBannerItem(BANNER_LINEUP[bannerIndex]);
            banner.classList.remove('swapping');
            bannerSwapTimer = null;
        }, 260);
    }, BANNER_ROTATE_MS);
}

function stopBannerRotation() {
    if (bannerTimer) {
        clearInterval(bannerTimer);
        bannerTimer = null;
    }
    if (bannerSwapTimer) {
        clearTimeout(bannerSwapTimer);
        bannerSwapTimer = null;
        const banner = document.getElementById('workshopBanner');
        if (banner) banner.classList.remove('swapping');
    }
}

// Add banner state management
function updateBannerState() {
    const banner = document.getElementById('workshopBanner');
    if (!banner) return;

    if (banner.style.display === 'none') {
        document.body.classList.add('banner-closed');
        document.body.classList.remove('banner-present', 'banner-minimized');
    } else if (banner.classList.contains('minimized')) {
        document.body.classList.add('banner-minimized', 'banner-present');
        document.body.classList.remove('banner-closed');
    } else {
        document.body.classList.add('banner-present');
        document.body.classList.remove('banner-closed', 'banner-minimized');
    }
}

function closeBanner(event) {
    event.stopPropagation();
    const banner = document.getElementById('workshopBanner');
    if (!banner) return;

    // Minimize instead of hide
    banner.classList.add('minimized');
    document.body.classList.add('banner-minimized');
    updateBannerState(); // Add this line

    // Force dropdown recalculation after banner transition
    setTimeout(() => {
        const dropdowns = document.querySelectorAll('.rt-dropdown');
        dropdowns.forEach(dropdown => {
            // Force browser to recalculate positioning
            dropdown.style.transform = 'translateY(-10px)';
            setTimeout(() => {
                if (dropdown.closest('.rt-nav-item.active')) {
                    dropdown.style.transform = 'translateY(0)';
                }
            }, 10);
        });
    }, 300); // After banner transition completes

    const closeBtn = banner.querySelector('.close-btn');
    if (closeBtn) closeBtn.style.display = 'none';
}

function expandBanner(event) {
    // Don't navigate if clicking close button or CTA (CTA has its own link)
    if (event.target.closest('.close-btn') || event.target.closest('.banner-cta')) {
        return;
    }

    const dest = bannerDestination();
    if (dest) window.location.href = dest;
}

function isMobileDevice() {
    return window.innerWidth <= 768 || /android|iphone|ipad|ipod|iemobile|blackberry|bada/i.test(
        (navigator.userAgent || navigator.vendor || window.opera).toLowerCase()
    );
}

// The expanded promotion and fixed nav consume too much of a narrow phone's
// first viewport. Apply the existing compact state synchronously so there is
// no full-height banner flash before the window load handler runs.
if (window.matchMedia('(max-width: 480px)').matches) {
    const banner = document.getElementById('workshopBanner');
    if (banner) {
        banner.classList.add('minimized');
        updateBannerState();
    }
}

// Simplified initialization - no glitchy animations
// Add to the window load event
window.addEventListener('load', function() {
    const banner = document.getElementById('workshopBanner');
    if (!banner) return;

    document.body.classList.add('banner-present'); // Add this line
    updateBannerState(); // Add this line

    // Make the entire banner clickable to navigate to the workshop
    banner.addEventListener('click', expandBanner);

    // Rotate only when more than one promotion is in window today.
    startBannerRotation();

    // Hold the current promotion while someone is reading or aiming at it.
    banner.addEventListener('mouseenter', stopBannerRotation);
    banner.addEventListener('mouseleave', startBannerRotation);
    banner.addEventListener('focusin', stopBannerRotation);
    banner.addEventListener('focusout', function(event) {
        if (!event.relatedTarget || !banner.contains(event.relatedTarget)) {
            startBannerRotation();
        }
    });

    // Expand banner on hover when minimized, collapse on mouse leave
    banner.addEventListener('mouseenter', function() {
        if (!banner.classList.contains('minimized')) return;
        banner.classList.remove('minimized');
        document.body.classList.remove('banner-minimized');
        document.body.classList.add('banner-present');
        updateBannerState();
        const closeBtn = banner.querySelector('.close-btn');
        if (closeBtn) closeBtn.style.display = '';
    });

    banner.addEventListener('mouseleave', function() {
        // Re-minimize when mouse leaves (only if it was auto-minimized)
        if (banner.classList.contains('minimized')) return;
        banner.classList.add('minimized');
        document.body.classList.add('banner-minimized');
        updateBannerState();
        const closeBtn = banner.querySelector('.close-btn');
        if (closeBtn) closeBtn.style.display = 'none';
    });

    // Auto-minimize after 3 seconds (no initial animation needed)
    setTimeout(() => {
        closeBanner({ stopPropagation: () => {} });
    }, 3000);
});

window.addEventListener('resize', function() {
    updateBannerState();
});
</script>
